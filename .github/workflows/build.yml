name: C/C++ CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: make
        run: make
